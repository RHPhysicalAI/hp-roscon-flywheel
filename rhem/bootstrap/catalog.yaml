# This project was developed with assistance from AI tools.
#
# Bootstrap once: flightctl apply -f rhem/bootstrap/catalog.yaml
#
# The RHEM software catalog that holds the promoted model versions (Phase 4.5 E2, D027/D038).
# Catalog API is **v1alpha1** in flightctl 1.3.0 (alpha, may change). Field names per
# api/core/v1alpha1/openapi.yaml (CatalogSpec: displayName, shortDescription, provider, support).
# The CatalogItems inside it are NOT applied by hand: ResourceSync/rhem-catalog renders them
# from gitops/rhem-catalog/ (resourcesync-catalog.yaml).
apiVersion: flightctl.io/v1alpha1
kind: Catalog
metadata:
  name: physical-ai-models
  labels:
    project: hp-roscon-flywheel
spec:
  displayName: Physical AI Models
  shortDescription: Promoted SO-ARM ACT policy versions (signed ModelCar images) as a Cincinnati version graph
  provider: hp-roscon-flywheel
  support: https://github.com/RHPhysicalAI/hp-roscon-flywheel
