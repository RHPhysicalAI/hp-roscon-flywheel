# This project was developed with assistance from AI tools.
#
# Cluster names for the guests, the tailnet (split DNS points at this host) and the host itself.
# Never listens on the lab-facing interface.
bind-dynamic
interface=lo
interface=virbr-fury
interface=tailscale0

# authoritative for the cluster zone: an unknown name gets NXDOMAIN here instead of being
# forwarded, which matters because the tailnet sends this zone straight back to us
local=/sno-flywheel.local/
address=/api.sno-flywheel.local/10.20.0.10
address=/api-int.sno-flywheel.local/10.20.0.10
address=/apps.sno-flywheel.local/10.20.0.10
# the node's own name, forward and reverse
host-record=master-0.sno-flywheel.local,10.20.0.10

# tailnet names to tailscale's resolver, everything else to whatever DHCP handed NetworkManager
server=/ts.net/100.100.100.100
resolv-file=/run/NetworkManager/no-stub-resolv.conf
domain-needed
bogus-priv
cache-size=1000
