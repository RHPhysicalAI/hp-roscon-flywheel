# This project was developed with assistance from AI tools.
#
# rendezvousIP, the address below, the dnsmasq records and the MAC in the VM definition all have to
# agree - an install was lost to a rendezvousIP mismatch before (D005). Matching is by MAC, so the
# interface name here does not have to be the guest's real one.
apiVersion: v1beta1
kind: AgentConfig
metadata:
  name: sno-flywheel
rendezvousIP: 10.20.0.10
hosts:
- hostname: master-0
  role: master
  interfaces:
  - name: enp1s0
    macAddress: 52:54:00:14:00:0a
  rootDeviceHints:
    deviceName: /dev/vda
  networkConfig:
    interfaces:
    - name: enp1s0
      type: ethernet
      state: up
      mac-address: 52:54:00:14:00:0a
      ipv4:
        enabled: true
        dhcp: false
        address:
        - ip: 10.20.0.10
          prefix-length: 24
    dns-resolver:
      config:
        server:
        - 10.20.0.1
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 10.20.0.1
        next-hop-interface: enp1s0
        table-id: 254
