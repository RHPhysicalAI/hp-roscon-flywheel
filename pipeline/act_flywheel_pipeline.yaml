deploymentSpec:
  executors:
    exec-eval-gate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - eval_gate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.36'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef eval_gate(eval_report_uri: str, s3_endpoint: str) -> str:\n \
          \   \"\"\"Gate: candidate vs incumbent on the same fixed seeds. Promote\
          \ iff net > 0 and p < 0.05 (D022).\n    Fails the pipeline (sys.exit 1)\
          \ otherwise - downstream never runs (thor-testing's hard-stop).\"\"\"\n\
          \    import json, os, sys, boto3\n    s3 = boto3.client(\"s3\", endpoint_url=s3_endpoint,\
          \ aws_access_key_id=os.environ[\"AWS_ACCESS_KEY_ID\"],\n               \
          \       aws_secret_access_key=os.environ[\"AWS_SECRET_ACCESS_KEY\"])\n \
          \   b, k = eval_report_uri[5:].split(\"/\", 1)\n    rep = json.loads(s3.get_object(Bucket=b,\
          \ Key=k)[\"Body\"].read())\n    print(json.dumps(rep, indent=1))\n    ok\
          \ = rep[\"net\"] > 0 and rep[\"sign_test_p\"] < 0.05\n    print(f\"GATE\
          \ {'PASS' if ok else 'FAIL'}: {rep['incumbent']} {rep['incumbent_success_rate']:.2f}\
          \ -> \"\n          f\"{rep['candidate']} {rep['candidate_success_rate']:.2f};\
          \ fixed {rep['fixed']} broken {rep['broken']} \"\n          f\"net {rep['net']:+d}\
          \ p={rep['sign_test_p']}\")\n    if not ok: sys.exit(1)\n    return json.dumps(rep)\
          \  # the report travels downstream as a parameter\n\n"
        image: registry.access.redhat.com/ubi9/python-312:9.8-1788919789
    exec-open-promotion-pr:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - open_promotion_pr
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'PyGithub==2.4.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef open_promotion_pr(image_ref: str, candidate: str, checkpoint_uri:\
          \ str, report_json: str, github_repo: str,\n                      gitops_branch:\
          \ str, fleet_file: str, consumer_file: str, fleet_ui_url: str) -> str:\n\
          \    \"\"\"ONE commit (thor-testing 5e3e87a: a partial flip is an outage)\
          \ editing the RHEM Fleet - modelcar\n    digest + MODEL_VERSION - and the\
          \ trigger's lineage in manifest-consumer, then a PR whose body carries\n\
          \    the eval report, the Fleet URL and the rollback (D025). Human merge\
          \ is the last gate.\"\"\"\n    import json, re\n    from github import Github,\
          \ InputGitTreeElement\n    tok = open(\"/etc/github/token\").read().strip()\n\
          \    repo = Github(tok).get_repo(github_repo)\n    base_ref = repo.get_git_ref(f\"\
          heads/{gitops_branch}\"); base = repo.get_git_commit(base_ref.object.sha)\n\
          \    def get(p): return repo.get_contents(p, ref=gitops_branch).decoded_content.decode()\n\
          \    digest = image_ref.split(\"@\", 1)[1]\n    # Fleet: the two-regex edit.\
          \ Both must match exactly once or the promotion is not attempted.\n    fleet\
          \ = get(fleet_file)\n    old_mv = re.search(r\"^\\s+MODEL_VERSION:\\s*(\\\
          S+)\", fleet, re.M).group(1)\n    fleet, n_img = re.subn(r\"(soarm-act-modelcar)@sha256:[0-9a-f]{64}\"\
          , r\"\\1@\" + digest, fleet, count=1)\n    fleet, n_mv = re.subn(r\"^(\\\
          s+MODEL_VERSION:\\s*)\\S+\", lambda m: m.group(1) + candidate, fleet, count=1,\
          \ flags=re.M)\n    # Trigger: the next round counts and fine-tunes from\
          \ the new lineage (same commit, D025).\n    consumer = get(consumer_file)\n\
          \    n_c = 0\n    for key, val in ((\"INCUMBENT\", candidate), (\"COLLECTOR\"\
          , candidate), (\"INCUMBENT_CHECKPOINT\", checkpoint_uri)):\n        consumer,\
          \ n = re.subn(r\"(\\{name: \" + key + r\", value: \\\")[^\\\"]*(\\\")\"\
          , lambda m: m.group(1) + val + m.group(2), consumer, count=1)\n        n_c\
          \ += n\n    if (n_img, n_mv, n_c) != (1, 1, 3):\n        print(f\"promotion\
          \ edit did not match exactly: image={n_img} model_version={n_mv} consumer={n_c}\"\
          ); raise SystemExit(1)\n    rep = json.loads(report_json)\n    elems = [InputGitTreeElement(fleet_file,\
          \ \"100644\", \"blob\", content=fleet),\n             InputGitTreeElement(consumer_file,\
          \ \"100644\", \"blob\", content=consumer)]\n    tree = repo.create_git_tree(elems,\
          \ base.tree)\n    msg = (f\"Promote {candidate}: Fleet act-inference <-\
          \ {digest[:19]}..., MODEL_VERSION {old_mv} -> {candidate}; manifest-consumer\
          \ lineage -> {candidate}\\n\\n\"\n           f\"Eval gate: {rep['incumbent']}\
          \ {rep['incumbent_success_rate']:.2f} -> {candidate} {rep['candidate_success_rate']:.2f},\
          \ fixed {rep['fixed']} broken {rep['broken']} net {rep['net']:+d} p={rep['sign_test_p']}\"\
          )\n    commit = repo.create_git_commit(msg, tree, [base])\n    head = f\"\
          promote/{candidate}\"; repo.create_git_ref(f\"refs/heads/{head}\", commit.sha)\n\
          \    body = (f\"## Promotion: `{candidate}` replaces `{rep['incumbent']}`\\\
          n\\n\"\n            f\"| | success | mean cubes |\\n|---|---|---|\\n| incumbent\
          \ `{rep['incumbent']}` | {rep['incumbent_success_rate']:.0%} | {rep['incumbent_mean_cubes']:.2f}\
          \ |\\n\"\n            f\"| candidate `{candidate}` | {rep['candidate_success_rate']:.0%}\
          \ | {rep['candidate_mean_cubes']:.2f} |\\n\\n\"\n            f\"Paired on\
          \ {rep['n_paired']} identical seeded scenes: **{rep['fixed']} fixed / {rep['broken']}\
          \ broken, net {rep['net']:+d}, sign-test p = {rep['sign_test_p']}** - gate\
          \ rule: {rep['rule']} -> **{rep['verdict']}**.\\n\\n\"\n            f\"\
          Signed modelcar: `{image_ref}`\\n\\n\"\n            f\"Merging edits Fleet\
          \ `act-inference` in one commit (`{fleet_file}`: modelcar digest + `MODEL_VERSION`\
          \ `{old_mv}` -> `{candidate}`) \"\n            f\"and points the trigger\
          \ at the new lineage (`{consumer_file}`: COLLECTOR/INCUMBENT/INCUMBENT_CHECKPOINT).\
          \ \"\n            f\"ResourceSync renders the Fleet; RHEM rolls it out batch\
          \ by batch; each device pulls the modelcar under its policy.json \"\n  \
          \          f\"(cosign key + Rekor SET) and restarts the container, which\
          \ publishes the new `model_version`.\\n\\n\"\n            f\"Fleet: {fleet_ui_url}\\\
          n\\n\"\n            f\"Rollback: `git revert <sha>` - revert the merge commit\
          \ of this PR and merge the revert. The previous modelcar is still in device\
          \ storage \"\n            f\"(image volume `reclaimPolicy: Retain`), so\
          \ rolling back does not re-pull.\")\n    pr = repo.create_pull(title=f\"\
          Promote {candidate} ({rep['incumbent_success_rate']:.0%} -> {rep['candidate_success_rate']:.0%})\"\
          , body=body, base=gitops_branch, head=head)\n    print(pr.html_url); return\
          \ pr.html_url\n\n"
        image: registry.access.redhat.com/ubi9/python-312:9.8-1788919789
    exec-package-modelcar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - package_modelcar
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.36'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef package_modelcar(checkpoint_uri: str, candidate: str, registry_repo:\
          \ str, platform: List[str],\n                     s3_endpoint: str, crane_version:\
          \ str, modelcar_base: str) -> str:\n    \"\"\"crane append per platform:\
          \ flat ACT checkpoint dir -> /models/act on ubi-micro, then one OCI index\n\
          \    at the candidate tag (the model layer is shared; only the ubi-micro\
          \ base differs). Returns index@digest.\"\"\"\n    import os, platform as\
          \ _plat, subprocess, tarfile, io, boto3, urllib.request\n    s3 = boto3.client(\"\
          s3\", endpoint_url=s3_endpoint, aws_access_key_id=os.environ[\"AWS_ACCESS_KEY_ID\"\
          ],\n                      aws_secret_access_key=os.environ[\"AWS_SECRET_ACCESS_KEY\"\
          ])\n    b, k = checkpoint_uri[5:].split(\"/\", 1)\n    buf = io.BytesIO(s3.get_object(Bucket=b,\
          \ Key=k)[\"Body\"].read())\n    os.makedirs(\"/tmp/layer/models/act\", exist_ok=True)\n\
          \    with tarfile.open(fileobj=buf, mode=\"r:gz\") as t:\n        for m\
          \ in t:\n            if m.isfile():\n                m.name = \"models/act/\"\
          \ + os.path.basename(m.name); t.extract(m, \"/tmp/layer\")\n    with tarfile.open(\"\
          /tmp/layer.tar\", \"w\") as t: t.add(\"/tmp/layer/models\", arcname=\"models\"\
          )\n    arch = {\"x86_64\": \"x86_64\", \"amd64\": \"x86_64\", \"aarch64\"\
          : \"arm64\", \"arm64\": \"arm64\"}[_plat.machine()]\n    url = f\"https://github.com/google/go-containerregistry/releases/download/{crane_version}/go-containerregistry_Linux_{arch}.tar.gz\"\
          \n    urllib.request.urlretrieve(url, \"/tmp/crane.tgz\"); subprocess.run([\"\
          tar\", \"-xzf\", \"/tmp/crane.tgz\", \"-C\", \"/tmp\", \"crane\"], check=True)\n\
          \    # quay-push is a kubernetes.io/dockerconfigjson Secret: the mounted\
          \ file is .dockerconfigjson,\n    # while crane/cosign look for $DOCKER_CONFIG/config.json.\n\
          \    import json as _j; os.makedirs(\"/tmp/docker\", exist_ok=True)\n  \
          \  cfg = _j.load(open(\"/etc/quay/.dockerconfigjson\"))\n    _j.dump({\"\
          auths\": cfg.get(\"auths\", {})}, open(\"/tmp/docker/config.json\", \"w\"\
          ))  # drop credsStore/credHelpers\n    os.environ[\"DOCKER_CONFIG\"] = \"\
          /tmp/docker\"\n    per_arch = []\n    for p in platform:\n        tag =\
          \ f\"{registry_repo}:{candidate}-{p.split('/', 1)[1].replace('/', '-')}\"\
          \n        r = subprocess.run([\"/tmp/crane\", \"append\", \"--platform\"\
          , p, \"-b\", modelcar_base,\n                            \"-f\", \"/tmp/layer.tar\"\
          , \"-t\", tag], capture_output=True, text=True)\n        if r.returncode\
          \ != 0:\n            print(f\"crane append {p} failed:\", r.stderr[-1500:]);\
          \ raise SystemExit(1)\n        per_arch.append(r.stdout.strip().splitlines()[-1]);\
          \ print(\"pushed\", per_arch[-1])\n    cmd = [\"/tmp/crane\", \"index\"\
          , \"append\", \"-t\", f\"{registry_repo}:{candidate}\"]\n    for m in per_arch:\
          \ cmd += [\"-m\", m]\n    r = subprocess.run(cmd, capture_output=True, text=True)\n\
          \    if r.returncode != 0:\n        print(\"crane index append failed:\"\
          , r.stderr[-1500:]); raise SystemExit(1)\n    ref = r.stdout.strip().splitlines()[-1];\
          \ print(\"pushed\", ref); return ref\n\n"
        image: registry.access.redhat.com/ubi9/python-312:9.8-1788919789
    exec-sign-modelcar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - sign_modelcar
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef sign_modelcar(image_ref: str, rekor_url: str, cosign_version:\
          \ str) -> str:\n    \"\"\"cosign v2.x sign by digest, --recursive so every\
          \ per-arch manifest of the index carries its own\n    signature (containers/image\
          \ verifies the instance it selects); Rekor when rekor_url is set (RHTAS).\n\
          \    COSIGN_PASSWORD arrives from the cosign-signing-key Secret's `cosign.password`\
          \ key.\"\"\"\n    import os, platform as _plat, subprocess, urllib.request\n\
          \    arch = {\"x86_64\": \"amd64\", \"amd64\": \"amd64\", \"aarch64\": \"\
          arm64\", \"arm64\": \"arm64\"}[_plat.machine()]\n    urllib.request.urlretrieve(f\"\
          https://github.com/sigstore/cosign/releases/download/{cosign_version}/cosign-linux-{arch}\"\
          , \"/tmp/cosign\")\n    os.chmod(\"/tmp/cosign\", 0o755)\n    if \"COSIGN_PASSWORD\"\
          \ not in os.environ:\n        print(\"cosign-signing-key has no `cosign.password`\
          \ key; assuming an unencrypted signing key\"); os.environ[\"COSIGN_PASSWORD\"\
          ] = \"\"\n    import json as _j; os.makedirs(\"/tmp/docker\", exist_ok=True)\n\
          \    cfg = _j.load(open(\"/etc/quay/.dockerconfigjson\"))\n    _j.dump({\"\
          auths\": cfg.get(\"auths\", {})}, open(\"/tmp/docker/config.json\", \"w\"\
          ))  # drop credsStore/credHelpers\n    os.environ[\"DOCKER_CONFIG\"] = \"\
          /tmp/docker\"\n    cmd = [\"/tmp/cosign\", \"sign\", \"--key\", \"/etc/cosign/cosign.key\"\
          , \"-y\", \"--recursive\", image_ref]\n    cmd += [\"--rekor-url\", rekor_url,\
          \ \"--tlog-upload=true\"] if rekor_url else [\"--tlog-upload=false\"]\n\
          \    subprocess.run(cmd, check=True); print(\"signed\", image_ref); return\
          \ image_ref\n\n"
        image: registry.access.redhat.com/ubi9/python-312:9.8-1788919789
    exec-trigger-and-wait:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - trigger_and_wait
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kafka-python>=2.2,<4'\
          \ 'boto3==1.35.36'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef trigger_and_wait(run_id: str, candidate: str, incumbent: str,\
          \ collector: str,\n                     incumbent_checkpoint: str, steps_per_frame:\
          \ float, eval_n: int,\n                     eval_seed_base: int, kafka_bootstrap:\
          \ str, timeout_min: int,\n                     eval_report: dsl.OutputPath(str),\
          \ checkpoint: dsl.OutputPath(str)):\n    \"\"\"[desktop shim] publish a\
          \ training trigger and wait for the host runner's result.\"\"\"\n    import\
          \ json, sys, time\n    from kafka import KafkaConsumer, KafkaProducer\n\
          \    msg = dict(run_id=run_id, candidate=candidate, incumbent=incumbent,\
          \ collector=collector,\n               incumbent_checkpoint=incumbent_checkpoint,\
          \ steps_per_frame=steps_per_frame,\n               eval_n=eval_n, eval_seed_base=eval_seed_base)\n\
          \    consumer = KafkaConsumer(\"training-results\", bootstrap_servers=kafka_bootstrap,\n\
          \                             group_id=f\"pipeline-{run_id}\", auto_offset_reset=\"\
          latest\",\n                             consumer_timeout_ms=60_000,\n  \
          \                           value_deserializer=lambda v: json.loads(v.decode()))\n\
          \    consumer.poll(1000)  # join the group before the trigger goes out\n\
          \    p = KafkaProducer(bootstrap_servers=kafka_bootstrap, value_serializer=lambda\
          \ v: json.dumps(v).encode())\n    p.send(\"training-triggers\", value=msg);\
          \ p.flush()\n    print(\"trigger sent:\", msg, flush=True)\n    deadline\
          \ = time.time() + timeout_min * 60\n    while time.time() < deadline:\n\
          \        for m in consumer:\n            if m.value.get(\"run_id\") == run_id:\n\
          \                res = m.value; print(\"result:\", res, flush=True)\n  \
          \              if res.get(\"status\") != \"ok\":\n                    print(\"\
          host runner failed:\", res.get(\"message\")); sys.exit(1)\n            \
          \    with open(eval_report, \"w\") as f: f.write(res[\"eval_report_uri\"\
          ])\n                with open(checkpoint, \"w\") as f: f.write(res[\"checkpoint_uri\"\
          ])\n                return\n        print(\"waiting for training-results...\"\
          , flush=True)\n    print(\"timed out waiting for the host runner\"); sys.exit(1)\n\
          \n"
