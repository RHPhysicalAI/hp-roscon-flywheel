  kubernetes:
    deploymentSpec:
      executors:
        exec-eval-gate:
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: s3-access-key
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: s3-secret-key
            optional: false
            secretName: hub-credentials
            secretNameParameter:
              runtimeValue:
                constant: hub-credentials
        exec-open-promotion-pr:
          secretAsVolume:
          - mountPath: /etc/github
            optional: false
            secretName: github-token
            secretNameParameter:
              runtimeValue:
                constant: github-token
        exec-package-modelcar:
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: s3-access-key
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: s3-secret-key
            optional: false
            secretName: hub-credentials
            secretNameParameter:
              runtimeValue:
                constant: hub-credentials
          secretAsVolume:
          - mountPath: /etc/quay
            optional: false
            secretName: quay-push
            secretNameParameter:
              runtimeValue:
                constant: quay-push
        exec-sign-modelcar:
          secretAsVolume:
          - mountPath: /etc/quay
            optional: false
            secretName: quay-push
            secretNameParameter:
              runtimeValue:
                constant: quay-push
          - mountPath: /etc/cosign
            optional: false
            secretName: cosign-signing-key
            secretNameParameter:
              runtimeValue:
                constant: cosign-signing-key
