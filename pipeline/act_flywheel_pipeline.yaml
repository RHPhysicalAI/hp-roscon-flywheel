# PIPELINE DEFINITION
# Name: act-flywheel-promotion
# Description: assemble -> train -> eval gate -> package -> sign -> Fleet promotion PR (D022, D025)
# Inputs:
#    candidate: str
#    catalog_item_file: str [Default: 'gitops/rhem-catalog/catalogitem-soarm-act.yaml']
#    collector: str [Default: 'upstream-act-teacher']
#    consumer_file: str [Default: 'gitops/flywheel/manifest-consumer.yaml']
#    cosign_version: str [Default: 'v2.6.5']
#    crane_version: str [Default: 'v0.20.3']
#    eval_n: int [Default: 100.0]
#    eval_seed_base: int [Default: 1000.0]
#    fleet_file: str [Default: 'gitops/rhem/fleet-act-inference.yaml']
#    fleet_ui_url: str [Default: 'https://ui.flightctl.apps.sno-flywheel.local/devicemanagement/fleets/act-inference']
#    github_repo: str [Default: 'RHPhysicalAI/hp-roscon-flywheel']
#    gitops_branch: str [Default: 'desktop-gpu-split']
#    incumbent: str [Default: 'upstream-act-teacher']
#    incumbent_checkpoint: str [Default: 'hf']
#    kafka_bootstrap: str [Default: 'edge-kafka.flywheel.svc:9092']
#    mode: str [Default: 'desktop']
#    model_registry_url: str [Default: 'https://flywheel.rhoai-model-registries.svc:8443']
#    modelcar_base: str [Default: 'registry.access.redhat.com/ubi9/ubi-micro:9.8-1787778798']
#    platform: list [Default: ['linux/amd64', 'linux/arm64']]
#    registry_repo: str [Default: 'quay.io/jary/soarm-act-modelcar']
#    rekor_url: str [Default: 'http://rekor-server.trusted-artifact-signer.svc']
#    s3_endpoint: str [Default: 'http://minio.minio.svc:9000']
#    steps_per_frame: float [Default: 0.25]
#    timeout_min: int [Default: 600.0]
components:
  comp-eval-gate:
    executorLabel: exec-eval-gate
    inputDefinitions:
      parameters:
        eval_report_uri:
          parameterType: STRING
        s3_endpoint:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-open-promotion-pr:
    executorLabel: exec-open-promotion-pr
    inputDefinitions:
      parameters:
        candidate:
          parameterType: STRING
        catalog_item_file:
          defaultValue: gitops/rhem-catalog/catalogitem-soarm-act.yaml
          isOptional: true
          parameterType: STRING
        checkpoint_uri:
          parameterType: STRING
        consumer_file:
          parameterType: STRING
        fleet_file:
          parameterType: STRING
        fleet_ui_url:
          parameterType: STRING
        github_repo:
          parameterType: STRING
        gitops_branch:
          parameterType: STRING
        image_ref:
          parameterType: STRING
        report_json:
          parameterType: STRING
        run_id:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-package-modelcar:
    executorLabel: exec-package-modelcar
    inputDefinitions:
      parameters:
        candidate:
          parameterType: STRING
        checkpoint_uri:
          parameterType: STRING
        crane_version:
          parameterType: STRING
        modelcar_base:
          parameterType: STRING
        platform:
          parameterType: LIST
        registry_repo:
          parameterType: STRING
        s3_endpoint:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-record-pr-url:
    executorLabel: exec-record-pr-url
    inputDefinitions:
      parameters:
        candidate:
          parameterType: STRING
        model_name:
          parameterType: STRING
        model_registry_url:
          parameterType: STRING
        pr_url:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-register-model:
    executorLabel: exec-register-model
    inputDefinitions:
      parameters:
        candidate:
          parameterType: STRING
        checkpoint_uri:
          parameterType: STRING
        dataset_uri:
          parameterType: STRING
        eval_report_uri:
          parameterType: STRING
        image_ref:
          parameterType: STRING
        model_name:
          parameterType: STRING
        model_registry_url:
          parameterType: STRING
        rekor_index:
          parameterType: NUMBER_INTEGER
        rekor_url:
          parameterType: STRING
        report_json:
          parameterType: STRING
        run_id:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-sign-modelcar:
    executorLabel: exec-sign-modelcar
    inputDefinitions:
      parameters:
        cosign_version:
          parameterType: STRING
        image_ref:
          parameterType: STRING
        rekor_url:
          parameterType: STRING
    outputDefinitions:
      parameters:
        image_ref:
          parameterType: STRING
        rekor_index:
          parameterType: NUMBER_INTEGER
  comp-trigger-and-wait:
    executorLabel: exec-trigger-and-wait
    inputDefinitions:
      parameters:
        candidate:
          parameterType: STRING
        collector:
          parameterType: STRING
        eval_n:
          parameterType: NUMBER_INTEGER
        eval_seed_base:
          parameterType: NUMBER_INTEGER
        incumbent:
          parameterType: STRING
        incumbent_checkpoint:
          parameterType: STRING
        kafka_bootstrap:
          parameterType: STRING
        run_id:
          parameterType: STRING
        steps_per_frame:
          parameterType: NUMBER_DOUBLE
        timeout_min:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        checkpoint:
          parameterType: STRING
        dataset_uri:
          parameterType: STRING
        eval_report:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-eval-gate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - eval_gate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.36'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef eval_gate(eval_report_uri: str, s3_endpoint: str) -> str:\n \
          \   \"\"\"Gate: candidate vs incumbent on the same fixed seeds. Promote\
          \ iff net > 0 and p < 0.05 (D022).\n    Fails the pipeline (sys.exit 1)\
          \ otherwise - downstream never runs (thor-testing's hard-stop).\"\"\"\n\
          \    import json, os, sys, boto3\n    s3 = boto3.client(\"s3\", endpoint_url=s3_endpoint,\
          \ aws_access_key_id=os.environ[\"AWS_ACCESS_KEY_ID\"],\n               \
          \       aws_secret_access_key=os.environ[\"AWS_SECRET_ACCESS_KEY\"])\n \
          \   b, k = eval_report_uri[5:].split(\"/\", 1)\n    rep = json.loads(s3.get_object(Bucket=b,\
          \ Key=k)[\"Body\"].read())\n    print(json.dumps(rep, indent=1))\n    ok\
          \ = rep[\"net\"] > 0 and rep[\"sign_test_p\"] < 0.05\n    print(f\"GATE\
          \ {'PASS' if ok else 'FAIL'}: {rep['incumbent']} {rep['incumbent_success_rate']:.2f}\
          \ -> \"\n          f\"{rep['candidate']} {rep['candidate_success_rate']:.2f};\
          \ fixed {rep['fixed']} broken {rep['broken']} \"\n          f\"net {rep['net']:+d}\
          \ p={rep['sign_test_p']}\")\n    if not ok: sys.exit(1)\n    return json.dumps(rep)\
          \  # the report travels downstream as a parameter\n\n"
        image: registry.access.redhat.com/ubi9/python-312:9.8-1788919789
    exec-open-promotion-pr:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - open_promotion_pr
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'PyGithub==2.4.0'\
          \ 'PyYAML>=6,<7'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef open_promotion_pr(image_ref: str, candidate: str, checkpoint_uri:\
          \ str, report_json: str, github_repo: str,\n                      gitops_branch:\
          \ str, fleet_file: str, consumer_file: str, fleet_ui_url: str, run_id: str,\n\
          \                      catalog_item_file: str = \"gitops/rhem-catalog/catalogitem-soarm-act.yaml\"\
          ) -> str:\n    \"\"\"ONE commit (thor-testing 5e3e87a: a partial flip is\
          \ an outage) editing the RHEM Fleet - modelcar\n    digest + MODEL_VERSION\
          \ - and the trigger's lineage in manifest-consumer, then a PR whose body\
          \ carries\n    the eval report, the Fleet URL and the rollback (D025). Human\
          \ merge is the last gate.\"\"\"\n    import json, re\n    from datetime\
          \ import datetime, timezone\n    from github import Github, GithubException,\
          \ InputGitTreeElement\n    tok = open(\"/etc/github/token\").read().strip()\n\
          \    repo = Github(tok).get_repo(github_repo)\n    base_ref = repo.get_git_ref(f\"\
          heads/{gitops_branch}\"); base = repo.get_git_commit(base_ref.object.sha)\n\
          \    def get(p): return repo.get_contents(p, ref=gitops_branch).decoded_content.decode()\n\
          \    digest = image_ref.split(\"@\", 1)[1]\n    # Fleet: the two-regex edit.\
          \ Both must match exactly once or the promotion is not attempted.\n    fleet\
          \ = get(fleet_file)\n    old_mv = re.search(r\"^\\s+MODEL_VERSION:\\s*(\\\
          S+)\", fleet, re.M).group(1)\n    fleet, n_img = re.subn(r\"(soarm-act-modelcar)@sha256:[0-9a-f]{64}\"\
          , r\"\\1@\" + digest, fleet, count=1)\n    fleet, n_mv = re.subn(r\"^(\\\
          s+MODEL_VERSION:\\s*)\\S+\", lambda m: m.group(1) + candidate, fleet, count=1,\
          \ flags=re.M)\n    # Trigger: the next round counts and fine-tunes from\
          \ the new lineage (same commit, D025).\n    consumer = get(consumer_file)\n\
          \    n_c = 0\n    for key, val in ((\"INCUMBENT\", candidate), (\"COLLECTOR\"\
          , candidate), (\"INCUMBENT_CHECKPOINT\", checkpoint_uri)):\n        consumer,\
          \ n = re.subn(r\"(\\{name: \" + key + r\", value: \\\")[^\\\"]*(\\\")\"\
          , lambda m: m.group(1) + val + m.group(2), consumer, count=1)\n        n_c\
          \ += n\n    if (n_img, n_mv, n_c) != (1, 1, 3):\n        print(f\"promotion\
          \ edit did not match exactly: image={n_img} model_version={n_mv} consumer={n_c}\"\
          ); raise SystemExit(1)\n    rep = json.loads(report_json)\n    elems = [InputGitTreeElement(fleet_file,\
          \ \"100644\", \"blob\", content=fleet),\n             InputGitTreeElement(consumer_file,\
          \ \"100644\", \"blob\", content=consumer)]\n\n    # ---- Catalog seam (D027)\
          \ BEGIN -- removable. Delete this fenced block, the `catalog_item_file`\
          \ param, the\n    # PyYAML pin and the `body += catalog_note` line when\
          \ RHEM's registry->catalog bridge lands. Nothing else\n    # reads its output:\
          \ the Fleet pins the digest (D038); the CatalogItem is the version graph\
          \ beside it.\n    def append_catalog_version(item_yaml: str, version: str,\
          \ digest: str, replaces: str) -> str:\n        \"\"\"Append `version` (a\
          \ candidate name) to the CatalogItem's `versions:` list, or refresh its\
          \ reference if\n        already present. Catalog API v1alpha1 requires strict\
          \ semver names, so `act-v<N>-<suffix>` is recorded as\n        `<N>.0.0-<suffix>`\
          \ with the candidate name in the version's readme; `replaces` is set only\
          \ when the\n        previous candidate is already a node. Everything before\
          \ `versions:` is kept byte-for-byte.\"\"\"\n        import yaml\n      \
          \  def semver(name):\n            m = re.fullmatch(r\"act-v(\\d+)-([0-9A-Za-z.-]+)\"\
          , name)\n            return f\"{m.group(1)}.0.0-{m.group(2)}\" if m else\
          \ \"0.0.0-\" + re.sub(r\"[^0-9A-Za-z.-]\", \"-\", name)\n        head, sep,\
          \ _ = item_yaml.partition(\"\\n  versions:\")\n        if not sep: raise\
          \ SystemExit(f\"{catalog_item_file}: no `versions:` key\")\n        doc\
          \ = yaml.safe_load(item_yaml)\n        uri = doc[\"spec\"][\"artifacts\"\
          ][0][\"uri\"]\n        versions = list(doc[\"spec\"].get(\"versions\") or\
          \ [])\n        sv, prev = semver(version), semver(replaces)\n        idx\
          \ = next((i for i, v in enumerate(versions) if v[\"version\"] == sv), None)\n\
          \        entry = {\"version\": sv, \"channels\": [\"stable\"], \"references\"\
          : {\"container\": digest},\n                 \"readme\": f\"candidate {version}\
          \ -- {uri}@{digest}\"}\n        if prev != sv and any(v[\"version\"] ==\
          \ prev for v in versions): entry[\"replaces\"] = prev\n        elif idx\
          \ is not None and versions[idx].get(\"replaces\"): entry[\"replaces\"] =\
          \ versions[idx][\"replaces\"]\n        if idx is None: versions.append(entry)\n\
          \        else: versions[idx] = entry\n        out = [head, \"  versions:\"\
          ]\n        for v in versions:\n            out += [f\"    - version: {json.dumps(v['version'])}\"\
          , f\"      channels: [{', '.join(v['channels'])}]\", \"      references:\"\
          ]\n            out += [f\"        {k}: {json.dumps(r)}\" for k, r in v[\"\
          references\"].items()]\n            if v.get(\"replaces\"): out.append(f\"\
          \      replaces: {json.dumps(v['replaces'])}\")\n            if v.get(\"\
          readme\"): out.append(f\"      readme: {json.dumps(v['readme'])}\")\n  \
          \      return \"\\n\".join(out) + \"\\n\"\n    catalog_note = \"\"\n   \
          \ try:\n        item = append_catalog_version(get(catalog_item_file), candidate,\
          \ digest, old_mv)\n        elems.append(InputGitTreeElement(catalog_item_file,\
          \ \"100644\", \"blob\", content=item))\n        catalog_note = (f\"\\n\\\
          nCatalog (v1alpha1, version graph only - the Fleet pins the digest): `{catalog_item_file}`\
          \ gains \"\n                        f\"version `{re.search(r'- version:\
          \ \\\"([^\\\"]+)\\\"[^-]*' + re.escape(digest), item, re.S).group(1)}` for\
          \ `{candidate}`.\")\n    except GithubException as e:\n        if e.status\
          \ != 404: raise\n        print(f\"catalog seam: {catalog_item_file} not\
          \ on {gitops_branch}, skipped (not load-bearing)\")\n    # ---- Catalog\
          \ seam END\n    tree = repo.create_git_tree(elems, base.tree)\n    msg =\
          \ (f\"Promote {candidate}: Fleet act-inference <- {digest[:19]}..., MODEL_VERSION\
          \ {old_mv} -> {candidate}; manifest-consumer lineage -> {candidate}\\n\\\
          n\"\n           f\"Eval gate: {rep['incumbent']} {rep['incumbent_success_rate']:.2f}\
          \ -> {candidate} {rep['candidate_success_rate']:.2f}, fixed {rep['fixed']}\
          \ broken {rep['broken']} net {rep['net']:+d} p={rep['sign_test_p']}\")\n\
          \    commit = repo.create_git_commit(msg, tree, [base])\n    # Branch unique\
          \ per run: a merged PR's head branch outlives it on GitHub, so a fixed name\
          \ 422s on the rerun.\n    head = f\"promote/{candidate}-\" + (run_id[:8]\
          \ if run_id else datetime.now(timezone.utc).strftime(\"%Y%m%d%H%M%S\"))\n\
          \    try:\n        repo.create_git_ref(f\"refs/heads/{head}\", commit.sha)\n\
          \    except GithubException as e:\n        if e.status != 422: raise\n \
          \       repo.get_git_ref(f\"heads/{head}\").edit(commit.sha, force=True);\
          \ print(\"ref existed, moved:\", head)\n    body = (f\"## Promotion: `{candidate}`\
          \ replaces `{rep['incumbent']}`\\n\\n\"\n            f\"| | success | mean\
          \ cubes |\\n|---|---|---|\\n| incumbent `{rep['incumbent']}` | {rep['incumbent_success_rate']:.0%}\
          \ | {rep['incumbent_mean_cubes']:.2f} |\\n\"\n            f\"| candidate\
          \ `{candidate}` | {rep['candidate_success_rate']:.0%} | {rep['candidate_mean_cubes']:.2f}\
          \ |\\n\\n\"\n            f\"Paired on {rep['n_paired']} identical seeded\
          \ scenes: **{rep['fixed']} fixed / {rep['broken']} broken, net {rep['net']:+d},\
          \ sign-test p = {rep['sign_test_p']}** - gate rule: {rep['rule']} -> **{rep['verdict']}**.\\\
          n\\n\"\n            f\"Signed modelcar: `{image_ref}`\\n\\n\"\n        \
          \    f\"Merging edits Fleet `act-inference` in one commit (`{fleet_file}`:\
          \ modelcar digest + `MODEL_VERSION` `{old_mv}` -> `{candidate}`) \"\n  \
          \          f\"and points the trigger at the new lineage (`{consumer_file}`:\
          \ COLLECTOR/INCUMBENT/INCUMBENT_CHECKPOINT). \"\n            f\"ResourceSync\
          \ renders the Fleet; RHEM rolls it out batch by batch; each device pulls\
          \ the modelcar under its policy.json \"\n            f\"(cosign key + Rekor\
          \ SET) and restarts the container, which publishes the new `model_version`.\\\
          n\\n\"\n            f\"Fleet: {fleet_ui_url}\\n\\n\"\n            f\"Rollback:\
          \ `git revert <sha>` - revert the merge commit of this PR and merge the\
          \ revert. The previous modelcar is still in device storage \"\n        \
          \    f\"(image volume `reclaimPolicy: Retain`), so rolling back does not\
          \ re-pull.\")\n    body += catalog_note  # Catalog seam (D027): delete with\
          \ the fenced block above\n    title = f\"Promote {candidate} ({rep['incumbent_success_rate']:.0%}\
          \ -> {rep['candidate_success_rate']:.0%})\"\n    existing = list(repo.get_pulls(state=\"\
          open\", base=gitops_branch, head=f\"{repo.owner.login}:{head}\"))\n    pr\
          \ = existing[0] if existing else repo.create_pull(title=title, body=body,\
          \ base=gitops_branch, head=head)\n    print(pr.html_url); return pr.html_url\n\
          \n"
        image: registry.access.redhat.com/ubi9/python-312:9.8-1788919789
    exec-package-modelcar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - package_modelcar
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.36'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef package_modelcar(checkpoint_uri: str, candidate: str, registry_repo:\
          \ str, platform: List[str],\n                     s3_endpoint: str, crane_version:\
          \ str, modelcar_base: str) -> str:\n    \"\"\"crane append per platform:\
          \ flat ACT checkpoint dir -> /models/act on ubi-micro, then one OCI index\n\
          \    at the candidate tag (the model layer is shared; only the ubi-micro\
          \ base differs). Returns index@digest.\"\"\"\n    import os, platform as\
          \ _plat, subprocess, tarfile, io, boto3, urllib.request\n    s3 = boto3.client(\"\
          s3\", endpoint_url=s3_endpoint, aws_access_key_id=os.environ[\"AWS_ACCESS_KEY_ID\"\
          ],\n                      aws_secret_access_key=os.environ[\"AWS_SECRET_ACCESS_KEY\"\
          ])\n    b, k = checkpoint_uri[5:].split(\"/\", 1)\n    buf = io.BytesIO(s3.get_object(Bucket=b,\
          \ Key=k)[\"Body\"].read())\n    os.makedirs(\"/tmp/layer/models/act\", exist_ok=True)\n\
          \    with tarfile.open(fileobj=buf, mode=\"r:gz\") as t:\n        for m\
          \ in t:\n            if m.isfile():\n                m.name = \"models/act/\"\
          \ + os.path.basename(m.name); t.extract(m, \"/tmp/layer\")\n    with tarfile.open(\"\
          /tmp/layer.tar\", \"w\") as t: t.add(\"/tmp/layer/models\", arcname=\"models\"\
          )\n    arch = {\"x86_64\": \"x86_64\", \"amd64\": \"x86_64\", \"aarch64\"\
          : \"arm64\", \"arm64\": \"arm64\"}[_plat.machine()]\n    url = f\"https://github.com/google/go-containerregistry/releases/download/{crane_version}/go-containerregistry_Linux_{arch}.tar.gz\"\
          \n    urllib.request.urlretrieve(url, \"/tmp/crane.tgz\"); subprocess.run([\"\
          tar\", \"-xzf\", \"/tmp/crane.tgz\", \"-C\", \"/tmp\", \"crane\"], check=True)\n\
          \    # quay-push is a kubernetes.io/dockerconfigjson Secret: the mounted\
          \ file is .dockerconfigjson,\n    # while crane/cosign look for $DOCKER_CONFIG/config.json.\n\
          \    import json as _j; os.makedirs(\"/tmp/docker\", exist_ok=True)\n  \
          \  cfg = _j.load(open(\"/etc/quay/.dockerconfigjson\"))\n    _j.dump({\"\
          auths\": cfg.get(\"auths\", {})}, open(\"/tmp/docker/config.json\", \"w\"\
          ))  # drop credsStore/credHelpers\n    os.environ[\"DOCKER_CONFIG\"] = \"\
          /tmp/docker\"\n    per_arch = []\n    for p in platform:\n        tag =\
          \ f\"{registry_repo}:{candidate}-{p.split('/', 1)[1].replace('/', '-')}\"\
          \n        r = subprocess.run([\"/tmp/crane\", \"append\", \"--platform\"\
          , p, \"-b\", modelcar_base,\n                            \"-f\", \"/tmp/layer.tar\"\
          , \"-t\", tag], capture_output=True, text=True)\n        if r.returncode\
          \ != 0:\n            print(f\"crane append {p} failed:\", r.stderr[-1500:]);\
