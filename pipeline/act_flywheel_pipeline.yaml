              taskOutputParameter:
                outputParameterKey: dataset_uri
                producerTask: trigger-and-wait
            eval_report_uri:
              taskOutputParameter:
                outputParameterKey: eval_report
                producerTask: trigger-and-wait
            image_ref:
              taskOutputParameter:
                outputParameterKey: image_ref
                producerTask: sign-modelcar
            model_name:
              runtimeValue:
