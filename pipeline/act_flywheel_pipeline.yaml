          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-trigger-and-wait:
    executorLabel: exec-trigger-and-wait
    inputDefinitions:
      parameters:
        candidate:
          parameterType: STRING
        collector:
          parameterType: STRING
        eval_n:
          parameterType: NUMBER_INTEGER
        eval_seed_base:
          parameterType: NUMBER_INTEGER
        incumbent:
          parameterType: STRING
        incumbent_checkpoint:
          parameterType: STRING
        kafka_bootstrap:
          parameterType: STRING
        run_id:
          parameterType: STRING
        steps_per_frame:
          parameterType: NUMBER_DOUBLE
        timeout_min:
          parameterType: NUMBER_INTEGER
