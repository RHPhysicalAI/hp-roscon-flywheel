pipelineInfo:
  description: assemble -> train -> eval gate -> package -> sign -> Fleet promotion
    PR (D022, D025)
  name: act-flywheel-promotion
root:
  dag:
    tasks:
      eval-gate:
        cachingOptions: {}
        componentRef:
          name: comp-eval-gate
        dependentTasks:
        - trigger-and-wait
        inputs:
          parameters:
            eval_report_uri:
              taskOutputParameter:
                outputParameterKey: eval_report
                producerTask: trigger-and-wait
            s3_endpoint:
              componentInputParameter: s3_endpoint
        taskInfo:
          name: eval-gate
      open-promotion-pr:
        cachingOptions: {}
        componentRef:
          name: comp-open-promotion-pr
        dependentTasks:
        - eval-gate
        - register-model
        - sign-modelcar
        - trigger-and-wait
        inputs:
          parameters:
            candidate:
              componentInputParameter: candidate
            catalog_item_file:
              componentInputParameter: catalog_item_file
            checkpoint_uri:
              taskOutputParameter:
                outputParameterKey: checkpoint
                producerTask: trigger-and-wait
            consumer_file:
              componentInputParameter: consumer_file
            fleet_file:
              componentInputParameter: fleet_file
            fleet_ui_url:
              componentInputParameter: fleet_ui_url
            github_repo:
              componentInputParameter: github_repo
            gitops_branch:
              componentInputParameter: gitops_branch
            image_ref:
              taskOutputParameter:
                outputParameterKey: image_ref
                producerTask: sign-modelcar
            report_json:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: eval-gate
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
        taskInfo:
          name: open-promotion-pr
      package-modelcar:
        cachingOptions: {}
        componentRef:
          name: comp-package-modelcar
        dependentTasks:
        - eval-gate
        - trigger-and-wait
        inputs:
          parameters:
            candidate:
              componentInputParameter: candidate
            checkpoint_uri:
              taskOutputParameter:
                outputParameterKey: checkpoint
                producerTask: trigger-and-wait
            crane_version:
              componentInputParameter: crane_version
            modelcar_base:
              componentInputParameter: modelcar_base
            platform:
              componentInputParameter: platform
            registry_repo:
              componentInputParameter: registry_repo
            s3_endpoint:
              componentInputParameter: s3_endpoint
        taskInfo:
          name: package-modelcar
      record-pr-url:
        cachingOptions: {}
        componentRef:
          name: comp-record-pr-url
        dependentTasks:
        - open-promotion-pr
        inputs:
          parameters:
            candidate:
              componentInputParameter: candidate
            model_name:
              runtimeValue:
                constant: soarm-act
            model_registry_url:
              componentInputParameter: model_registry_url
            pr_url:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: open-promotion-pr
        taskInfo:
          name: record-pr-url
