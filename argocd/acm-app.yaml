# This project was developed with assistance from AI tools.
#
# PREPARED — DO NOT APPLY YET (D135). Applying this syncs gitops/acm/ (ACM operator +
# MultiClusterHub), which does not fit the current 16-vCPU SNO (~2 cores free, ACM needs ~4+).
# Resize the SNO VM first (see gitops/acm/README.md), then `oc apply -f argocd/acm-app.yaml`.
# Manual sync policy on purpose — no auto-sync until the node can hold it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acm
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RHPhysicalAI/hp-roscon-flywheel.git
    targetRevision: desktop-gpu-split
    path: gitops/acm
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Deliberately no `automated:` block — this app is synced by hand after the VM resize.
