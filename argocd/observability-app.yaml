# This project was developed with assistance from AI tools.
#
# Bootstrap once: oc apply -f argocd/observability-app.yaml
# Committed from the live Application (Phase 4.5 F, D026 row 5); prune: true so the cluster
# equals gitops/observability. The live app tracked main; the directory is
# identical on both branches and every other app follows desktop-gpu-split, so this one does too.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: openshift-gitops
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  project: default
  source:
    path: gitops/observability
    repoURL: https://github.com/RHPhysicalAI/hp-roscon-flywheel.git
    targetRevision: desktop-gpu-split
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
