# This project was developed with assistance from AI tools.
#
# Bootstrap once, BEFORE argocd/rhem-app.yaml: oc apply -f argocd/repo-flightctl-charts.yaml
#
# Registers quay.io/flightctl/charts as a Helm OCI repository for Argo CD. The registry is
# public, so this Secret carries no credentials and is safe to keep in git (D024).
apiVersion: v1
kind: Secret
metadata:
  name: flightctl-charts
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  name: flightctl-charts
  type: helm
  url: quay.io/flightctl/charts
  enableOCI: "true"
