# Bootstrap once: oc apply -f argocd/operators-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operators
  namespace: openshift-gitops
spec:
  destination:
    namespace: openshift-operators
    server: https://kubernetes.default.svc
  project: default
  source:
    path: gitops/operators
    repoURL: https://github.com/RHPhysicalAI/hp-roscon-flywheel.git
    targetRevision: desktop-gpu-split
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
