apiVersion: dscinitialization.opendatahub.io/v2
kind: DSCInitialization
metadata:
  name: default-dsci
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  applicationsNamespace: redhat-ods-applications
  monitoring:
    managementState: Removed
  trustedCABundle:
    managementState: Managed
---
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    dashboard:
      managementState: Managed   # D134: re-enabled — node headroom recovered; gives the DSP run graph (Beat 3) and Model Registry UI (Beat 6)
    aipipelines:
      managementState: Managed
    kserve:
      managementState: Removed   # nothing is served through KServe here; Removed also avoids the cert-manager prerequisite
    modelregistry:
      managementState: Managed
      registriesNamespace: rhoai-model-registries   # Phase 4.5 E1 (D027): ModelRegistry CR + MariaDB in model-registry.yaml
    workbenches:
      managementState: Removed
    ray:
      managementState: Removed
    kueue:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trainer:
      managementState: Removed
    trustyai:
      managementState: Removed
    feastoperator:
      managementState: Removed
    ogx:
      managementState: Removed
    mlflowoperator:
      managementState: Removed
