# This project was developed with assistance from AI tools.
#
# Scoped read-only MinIO user for the eval dashboard.
# GetObject/ListBucket only, on episodes-curated, episodes-rejected and the
# eval/ prefix of episodes-data (promotion evidence) — no write access, no
# access to other buckets or prefixes, not the root account.
# The Job is an Argo sync hook and idempotent (mc admin user/policy commands are
# upsert-safe), so it runs again on every sync of this app and fails loudly.
#
# Like the root MinIO credentials (minio-credentials here, hub-credentials in
# flywheel — hand-created since Phase 4.5 F), this Secret is applied directly
# to the cluster (`oc apply`) and deliberately NOT committed to git.
# It won't be pruned by Argo since Argo never manages a resource it didn't
# sync in. The consumer is the in-cluster eval dashboard
# (gitops/flywheel/eval-dashboard.yaml). A pod cannot reference a Secret across
# namespaces, so the same Secret is hand-created twice with the same values:
# in minio for this Job and in flywheel for the Deployments. Recreate it with:
#   oc create secret generic minio-eval-readonly-credentials -n <minio|flywheel> \
#     --from-literal=access-key=eval-readonly \
#     --from-literal=secret-key=<generated>
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-eval-readonly-policy
  namespace: minio
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject"],
          "Resource": [
            "arn:aws:s3:::episodes-curated/*",
            "arn:aws:s3:::episodes-rejected/*"
          ]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:ListBucket"],
          "Resource": [
            "arn:aws:s3:::episodes-curated",
            "arn:aws:s3:::episodes-rejected"
          ]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject"],
          "Resource": ["arn:aws:s3:::episodes-data/eval/*"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:ListBucket"],
          "Resource": ["arn:aws:s3:::episodes-data"],
          "Condition": {"StringLike": {"s3:prefix": ["eval/*"]}}
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-eval-readonly-setup
  namespace: minio
  annotations:
    # A hook, replaced on every sync, run once MinIO and the policy ConfigMap are in place: a Job's pod
    # template is immutable, and the policy has to be applied again whenever it changes. Safe to repeat.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727  # was :latest; digest matches what's live (C8, review D115); multi-arch manifest list
          command:
            - sh
            - -c
            - |
              set -eu
              # The pod runs as an arbitrary uid with no writable home: without this mc cannot save the alias,
              # every later command fails, and the script used to report "done" all the same.
              export MC_CONFIG_DIR=/tmp/mc
              mc alias set myminio http://minio.minio.svc:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc admin user add myminio "$RO_ACCESS_KEY" "$RO_SECRET_KEY"
              mc admin policy create myminio episodes-readonly /policy/policy.json
              # attach fails when the policy is already attached: accept that only if the user really has it
              mc admin policy attach myminio episodes-readonly --user="$RO_ACCESS_KEY" ||
                mc admin user info myminio "$RO_ACCESS_KEY" | grep -q episodes-readonly
              echo "[minio-eval-readonly-setup] done"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            - name: RO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-eval-readonly-credentials
                  key: access-key
            - name: RO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-eval-readonly-credentials
                  key: secret-key
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: minio-eval-readonly-policy
