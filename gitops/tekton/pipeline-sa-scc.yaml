# This project was developed with assistance from AI tools.
#
# The `pipeline` ServiceAccount (created by the Pipelines operator in every namespace) runs the
# runtime-image PipelineRuns. Its default `pipelines-scc` is not enough for the cross-arch build:
# buildah under qemu-user segfaults unless the build step is privileged (thor-testing D009; D028).
# A namespaced RoleBinding to the privileged SCC's ClusterRole is what
# `oc adm policy add-scc-to-user privileged -z pipeline -n flywheel` would create, kept in git.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-privileged-scc
  namespace: flywheel
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: flywheel
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:privileged
  apiGroup: rbac.authorization.k8s.io
