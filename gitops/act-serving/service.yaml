apiVersion: v1
kind: Service
metadata:
  name: act-policy
  namespace: flywheel
spec:
  type: ClusterIP
  selector:
    app: act-policy
    color: blue          # the LIVE side. A promotion flips this in the same commit as the replicas.
  ports:
    - name: policy-server
      port: 8080
      targetPort: policy-server
