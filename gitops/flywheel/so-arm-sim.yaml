# SO-ARM101 Gazebo sim — the flywheel's episode producer.
#
# desktop-gpu-split mode: sim + cameras + episode emitter run in SNO.
# ACT inference runs on the host GPU via a separate container connected
# over zenoh (port 7447).
#
# Sim resets between episodes (cubes to start, arm to home) for genuine
# independent trials.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: so-arm-sim
  namespace: flywheel
  labels:
    app: so-arm-sim
spec:
  # Sim runs on host in desktop-gpu-split mode, not in SNO
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: so-arm-sim
  template:
    metadata:
      labels:
        app: so-arm-sim
    spec:
      containers:
        - name: so-arm-sim
          # was :latest (C8, review D115). NOTE: this Deployment is scaled to 0 replicas and
          # vestigial (D097) — the real sim producer runs as a host Docker container tagged
          # :sim-only, built locally and never pushed to quay (no registry digest exists for it).
          # This pin is to :latest's own current content, which is stale relative to :sim-only —
          # pinning removes the floating-tag anti-pattern but does not make this manifest
          # accurately describe what's live. If this Deployment is ever meant to run for real
          # (e.g. an in-cluster sim on the Fury), :sim-only needs to be pushed to quay first.
          image: quay.io/jary/soarm-flywheel@sha256:9b0e0123f96c3607328dc1bc18aebc595617b506a53bb3cc6c493f4755f17af2
          env:
            - name: MODEL_VERSION
              value: "soarm-act-v1"
            - name: SCENE
              value: "place_cubes_on_tray"
            - name: EPISODE_TIMEOUT_S
              value: "30.0"
            - name: MAX_EPISODE_S
              value: "30.0"
            - name: MIN_STEPS
              value: "10"
            - name: MCP_ENABLED
              value: "false"
            - name: CAMERA_BRIDGE_PORT
              value: "8081"
          ports:
            - containerPort: 8081
              name: camera
            - containerPort: 7447
              name: zenoh
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 8Gi
          volumeMounts:
            - name: episodes
              mountPath: /data/episodes
      volumes:
        - name: episodes
          hostPath:
            path: /var/lib/episodes
---
apiVersion: v1
kind: Service
metadata:
  name: so-arm-sim
  namespace: flywheel
spec:
  type: NodePort
  selector:
    app: so-arm-sim
  ports:
    - name: camera
      port: 8081
      targetPort: 8081
      nodePort: 30881
    - name: zenoh
      port: 7447
      targetPort: 7447
      nodePort: 30747
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sim-cameras
  namespace: flywheel
  annotations:
    haproxy.router.openshift.io/timeout: 3600s
spec:
  to:
    kind: Service
    name: so-arm-sim
  port:
    targetPort: camera
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
