# Trigger for the governed pipeline (D022): counts curated episode manifests and starts a
# Data Science Pipelines run once TRIGGER_THRESHOLD new curated successes have arrived
# (thor-testing hub-training/manifest-consumer shape; threshold raised from 10 to 160 —
# D021 showed small-batch retrains degrade the policy). Inert until TRAINING_PIPELINE_ID is set.
apiVersion: v1
kind: ConfigMap
metadata:
  name: manifest-consumer-code
  namespace: flywheel
data:
  consumer.py: |
    import json, os, time, urllib.request, ssl
    from datetime import datetime, timezone
    from kafka import KafkaConsumer, KafkaProducer
    BOOT = os.environ.get("KAFKA_BOOTSTRAP", "edge-kafka.flywheel.svc:9092")
    # DSP's oauth-proxy serves an OpenShift service-serving cert; verify it against the service CA
    # the pod already mounts instead of disabling TLS verification (review W-9).
    SERVICE_CA = os.environ.get("SERVICE_CA", "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt")
    THRESH = int(os.environ.get("TRIGGER_THRESHOLD", "160")); COOLDOWN = int(os.environ.get("TRIGGER_COOLDOWN", "3600"))
    # The pipeline is found by name: its id is different on every cluster it is uploaded to.
    DSP_URL = os.environ.get("DSP_URL", ""); PIPELINE_NAME = os.environ.get("TRAINING_PIPELINE_NAME", "")
    INCUMBENT = os.environ.get("INCUMBENT", "upstream-act-teacher"); COLLECTOR = os.environ.get("COLLECTOR", INCUMBENT)
    INCUMBENT_CKPT = os.environ.get("INCUMBENT_CHECKPOINT", "hf")  # "hf" = upstream teacher; else s3://... tarball
    # Episodes recorded before this moment are not counted (ISO-8601). Set when records were taken out of the
    # training set after the fact: the dataset is built from the curated bucket, and the count has to mean the same.
    def when(v):
        try:
            t = datetime.fromisoformat(str(v).strip().replace("Z", "+00:00"))
            return t if t.tzinfo else t.replace(tzinfo=timezone.utc)
        except Exception: return None
    COUNT_SINCE = when(os.environ.get("COUNT_SINCE", ""))
    def token():
        return open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
    def get(path):
        ctx = ssl.create_default_context(cafile=SERVICE_CA)
        req = urllib.request.Request(f"{DSP_URL}{path}", headers={"Authorization": f"Bearer {token()}"})
        with urllib.request.urlopen(req, context=ctx, timeout=30) as r: return json.load(r)
    def pipeline_id():
        ids = [x["pipeline_id"] for x in get("/apis/v2beta1/pipelines?page_size=100").get("pipelines", []) if x.get("display_name") == PIPELINE_NAME]
        if len(ids) != 1: raise RuntimeError(f"{len(ids)} pipelines named {PIPELINE_NAME!r} on {DSP_URL} (tools/hub/upload-pipeline.sh uploads it)")
        return ids[0]
    def latest_version_id(pid):
        return get(f"/apis/v2beta1/pipelines/{pid}/versions?sort_by=created_at%20desc&page_size=1")["pipeline_versions"][0]["pipeline_version_id"]
    def start_run(n):
        cand = f"{COLLECTOR}-ft{n}-{time.strftime('%Y%m%d%H%M')}"; pid = pipeline_id()
        body = {"display_name": f"promote-{cand}", "pipeline_version_reference": {"pipeline_id": pid, "pipeline_version_id": latest_version_id(pid)},
                "runtime_config": {"parameters": {"candidate": cand, "incumbent": INCUMBENT, "collector": COLLECTOR, "incumbent_checkpoint": INCUMBENT_CKPT}}}
        req = urllib.request.Request(f"{DSP_URL}/apis/v2beta1/runs", data=json.dumps(body).encode(),
                                     headers={"Authorization": f"Bearer {token()}", "Content-Type": "application/json"}, method="POST")
        ctx = ssl.create_default_context(cafile=SERVICE_CA)
        with urllib.request.urlopen(req, context=ctx, timeout=30) as r: print("[consumer] started run:", r.status, cand, flush=True)
    def decode(v):
        try: return json.loads(v.decode())
        except Exception: return {}   # a malformed record must not wedge a consumer that replays from its last commit
    def main():
        # A collection takes hours, so the count has to survive this pod. Offsets are committed only once a
        # run has been started: after a restart every manifest since the last trigger is read and counted
        # again. For the same reason a run that fails to start keeps the count and is tried again later, and
        # with no pipeline configured the count is kept until one is.
        c = KafkaConsumer("episode-manifests", bootstrap_servers=BOOT, group_id="manifest-consumer", auto_offset_reset="earliest",
                          enable_auto_commit=False, value_deserializer=decode)
        p = KafkaProducer(bootstrap_servers=BOOT, value_serializer=lambda v: json.dumps(v).encode())
        pending, last, retry_at, told = 0, 0.0, 0.0, False
        armed = bool(PIPELINE_NAME and DSP_URL)
        print(f"[consumer] threshold={THRESH} cooldown={COOLDOWN}s pipeline={PIPELINE_NAME if armed else 'UNSET (counting only)'}", flush=True)
        for m in c:
            if m.value.get("model_version") != COLLECTOR: continue
            # a manifest without a readable timestamp is counted: better an early trigger than a lost episode
            if COUNT_SINCE and (when(m.value.get("timestamp")) or COUNT_SINCE) < COUNT_SINCE: continue
            pending += 1
            print(f"[consumer] pending={pending}/{THRESH} collector={COLLECTOR}", flush=True)
            now = time.time()
            if pending < THRESH or now - last <= COOLDOWN or now < retry_at: continue
            if not armed:
                if not told: print("[consumer] threshold reached, no pipeline configured: the count is kept", flush=True); told = True
                continue
            evt = {"event": "training-trigger", "pending": pending, "collector": COLLECTOR, "ts": now}
            try: start_run(pending)
            except Exception as e:
                retry_at = now + 300; print("[consumer] run start failed, count kept, next try in 5 min:", e, flush=True); continue
            p.send("training-events", value=evt); p.flush(); print("[consumer]", evt, flush=True)
            c.commit(); pending, last = 0, now
    while True:
        try: main()
        except Exception as e: print("[consumer] crashed, restarting:", e, flush=True); time.sleep(10)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest-consumer
  namespace: flywheel
spec:
  replicas: 1
  selector:
    matchLabels: {app: manifest-consumer}
  template:
    metadata:
      labels: {app: manifest-consumer}
    spec:
      serviceAccountName: manifest-consumer
      containers:
        - name: consumer
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["sh", "-c", "pip install -q 'kafka-python>=2.2,<4' && python /code/consumer.py"]
          env:
            # consumer.py is mounted from a ConfigMap and read once at process start (like
            # dashboard.yaml's DASHBOARD_CODE_REV, D097) — bump this alongside code changes so
            # Argo rolls the pod instead of leaving the old code running against a new ConfigMap.
            - {name: CONSUMER_CODE_REV, value: "2026-09-20-count-since"}
            # the collection scene was fixed at 12:08 UTC that day; earlier episodes were archived out of the curated bucket
            - {name: COUNT_SINCE, value: "2026-09-20T12:00:00Z"}
            - {name: KAFKA_BOOTSTRAP, value: "edge-kafka.flywheel.svc:9092"}
            - {name: TRIGGER_THRESHOLD, value: "160"}
            - {name: TRIGGER_COOLDOWN, value: "3600"}
            # Round B (after PR #1): v2 collects; the next candidate is fine-tuned FROM v2 and gated against it.
            - {name: INCUMBENT, value: "upstream-act-teacher"}
            - {name: COLLECTOR, value: "upstream-act-teacher"}
            - {name: INCUMBENT_CHECKPOINT, value: "s3://episodes-data/checkpoints/upstream-act-teacher/pretrained_model.tar.gz"}
            - {name: DSP_URL, value: "https://ds-pipeline-dspa.flywheel.svc:8443"}
            # Armed 2026-09-19, once the host runner, the eval rig, the incumbent checkpoint and the registry step
            # were in place (D155). Remove this line to count without triggering: the count is kept (see main()).
            - {name: TRAINING_PIPELINE_NAME, value: "act-flywheel-promotion"}
          volumeMounts:
            - {name: code, mountPath: /code}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
      volumes:
        - name: code
          configMap: {name: manifest-consumer-code}
