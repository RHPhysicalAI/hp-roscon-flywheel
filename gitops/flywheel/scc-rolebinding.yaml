# This project was developed with assistance from AI tools.
#
# SCC grants for the flywheel namespace, scoped to what each workload actually needs (review W-11;
# pattern: gitops/tekton/pipeline-sa-scc.yaml). Namespaced RoleBindings to the SCC ClusterRoles are
# what `oc adm policy add-scc-to-user <scc> -z <sa> -n flywheel` creates, kept in git.
#
# - `default` SA (curator, sync-agent, rejected-mirror): hostPath /var/lib/episodes only —
#   hostmount-anyuid, not privileged.
# - `edge-kafka` SA: the broker keeps privileged (see edge-kafka.yaml for why).
# - `dashboard` SA: hostPath episode/frame volumes — hostmount-anyuid.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-kafka
  namespace: flywheel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edge-kafka-privileged-scc
  namespace: flywheel
subjects:
  - kind: ServiceAccount
    name: edge-kafka
    namespace: flywheel
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:privileged
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flywheel-default-hostmount-scc
  namespace: flywheel
subjects:
  - kind: ServiceAccount
    name: default
    namespace: flywheel
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:hostmount-anyuid
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flywheel-dashboard-hostmount-scc
  namespace: flywheel
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: flywheel
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:hostmount-anyuid
  apiGroup: rbac.authorization.k8s.io
