# hub-credentials — S3 credentials for the local MinIO.
# In thor-testing these pointed at the OSD-hosted hub MinIO.
# Here they point at the local MinIO in the minio namespace.
---
apiVersion: v1
kind: Secret
metadata:
  name: hub-credentials
  namespace: flywheel
type: Opaque
stringData:
  s3-access-key: minioadmin
  s3-secret-key: minioadmin
