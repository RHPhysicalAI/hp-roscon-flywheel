apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ods-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
  annotations:
    # SNO VM pulls bundle images slowly; OLM's default unpack deadline (10m) expired for every
    # operator on first try (BundleUnpackFailed: DeadlineExceeded).
    operatorframework.io/bundle-unpack-timeout: "60m"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
spec:
  channel: stable
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  config:
    # SNO: the CSV asks 3 replicas x 500m CPU (99% of the node's requests were allocated while it
    # ran at 12%); the override keeps the CSV limits and drops the request so the Model Registry
    # (Phase 4.5 E1) and the DSP run pods can schedule. Real load is unchanged.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 4Gi}
