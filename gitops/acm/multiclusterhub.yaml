# This project was developed with assistance from AI tools.
#
# PREPARED — NOT APPLIED. See gitops/acm/README.md and D135. Create this only after the ACM
# operator CSV is Succeeded AND the node has room (post VM resize). On a single SNO, trim heavy
# components to fit — the edge-manager path does not need search/observability/cluster-backup.
# The exact component names below are the ACM 2.17 set; validate against the installed
# MultiClusterHub CRD (`oc explain multiclusterhub.spec.overrides.components`) before applying,
# since the list and the edge-manager component name are version-specific (2.13 docs called it
# `edge-manager-preview`, Tech Preview, disabled by default).
apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  name: multiclusterhub
  namespace: open-cluster-management
spec:
  overrides:
    components:
      # Keep: the edge-manager (RHEM) + its console integration — the whole point here.
      - name: edge-manager-preview
        enabled: true
      # Trim heavy hub features not needed for a single-box edge-manager demo (reduces CPU/mem
      # footprint so it has a chance of fitting). Validate names against the installed CRD.
      - name: search
        enabled: false
      - name: cluster-backup
        enabled: false
      - name: volsync
        enabled: false
