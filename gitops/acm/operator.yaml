# This project was developed with assistance from AI tools.
#
# PREPARED — NOT APPLIED. Blocked on node CPU (D135): the SNO is at ~87% CPU requested
# (13.5 of 15.5 cores) and ACM's MultiClusterHub needs ~4+ cores for the hub base. Applying
# this on the current 16-vCPU VM would leave MCH components Pending and risk starving the
# running demo. Apply only after the SNO VM is resized (operator action; see gitops/acm/README.md).
#
# Red Hat Advanced Cluster Management operator (ACM 2.17). Pulls in multicluster-engine as a
# dependency. This is the integrated-console path for RHEM: once the MultiClusterHub's
# edge-manager component is enabled and the flightctl console plugin is added, fleets/devices
# appear inside the OpenShift console (vs. the standalone flightctl UI route).
apiVersion: v1
kind: Namespace
metadata:
  name: open-cluster-management
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: open-cluster-management-og
  namespace: open-cluster-management
spec:
  targetNamespaces:
    - open-cluster-management
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: advanced-cluster-management
  namespace: open-cluster-management
spec:
  channel: release-2.17
  installPlanApproval: Automatic
  name: advanced-cluster-management
  source: redhat-operators
  sourceNamespace: openshift-marketplace
